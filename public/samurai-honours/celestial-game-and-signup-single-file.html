<!DOCTYPE html>

  <style>

.rankcard{display:grid;grid-template-columns:1.2fr 1.5fr;gap:14px;align-items:center}
.lbl{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;opacity:.6}.rank{font-size:1.6rem;color:var(--gold)}.sub{font-size:.85rem;opacity:.75;margin-top:4px}

.btn{background:var(--gold);color:#1a1405;border:0;padding:9px 16px;border-radius:8px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.5}.btn.big{width:100%;padding:12px;margin-top:10px}
.tabs2{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tab2 b{opacity:.7;font-weight:400;margin-left:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.slot{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.slot .art{position:relative;aspect-ratio:4/3;background:#080910}.slot svg,.slot img,.wall .m svg,.wall .m img{width:100%;height:100%;display:block;object-fit:cover}
.slot.lock .art{opacity:.55;filter:grayscale(1) blur(.3px)}.slot.lock .nm{opacity:.65}
.nm{padding:8px 10px 0;font-weight:700}.hint{padding:2px 10px 10px;font-size:.75rem;opacity:.55;line-height:1.35}.meta{padding:2px 10px 6px;font-size:.72rem;opacity:.65;line-height:1.35}

.hanko.big{position:static;width:64px;height:64px;font-size:36px;margin:0 auto 8px}

.lens{position:absolute;left:6px;top:6px;font-size:.65rem;background:#0b0c10bb;color:var(--gold);padding:2px 6px;border-radius:4px}
.react{display:flex;gap:6px;padding:0 10px 10px}.react button,.react span{background:#1b1e2a;border:1px solid var(--line);color:var(--silver);border-radius:6px;padding:3px 8px;font-size:.78rem;cursor:pointer}.react button:disabled{opacity:.45;cursor:default}
.bar2{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:16px 0 10px}.bar2 h2{font-size:1.2rem;color:var(--gold)}
.up{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-size:.82rem;opacity:.9;margin-top:10px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chk{display:flex;gap:8px;align-items:center}.chk input{width:auto;margin:0}
.drop{position:relative;margin-top:10px;border:2px dashed #d4af3777;border-radius:12px;min-height:200px;display:grid;place-items:center;text-align:center;cursor:pointer;overflow:hidden;padding:10px}.drop img{max-width:100%;max-height:240px;border-radius:8px}
.drop.scanning::after{content:"";position:absolute;left:0;right:0;height:3px;background:var(--gold);box-shadow:0 0 18px 6px #d4af3799;animation:scan 1s ease-in-out infinite alternate}
@keyframes scan{from{top:0}to{top:100%}}
.stat{position:absolute;bottom:8px;left:0;right:0;font-size:.85rem;color:var(--gold);display:none;text-shadow:0 0 6px #000}.scanning .stat{display:block}
.pts{width:100%;border-collapse:collapse;font-size:.88rem;margin-top:8px}.pts td{padding:5px 0;border-bottom:1px solid var(--line)}.pts td:last-child{text-align:right;color:var(--gold)}
.resbox{text-align:center}.resbox .kv{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:10px 0;font-size:.85rem}

.moon{flex:none;width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#e0654a,#8e2a22 70%);box-shadow:0 0 40px #c7452d88}
.live{display:inline-block;width:9px;height:9px;border-radius:50%;background:#e5484d;margin-right:6px;animation:glow 1.6s infinite}

.x{position:absolute;right:12px;top:8px;background:none;border:0;color:var(--silver);font-size:1.6rem;cursor:pointer}.mh{display:flex;gap:12px;align-items:center;margin-bottom:12px}.mh .av{font-size:2.4rem}

.chk2{list-style:none;padding:0;margin:10px 0;text-align:left;font-size:.85rem}.chk2 li{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}.chk2 small{display:block;opacity:.65;word-break:break-word}.chk2 .ok b{color:#6fd39a}.chk2 .no b{color:#ef6a6a}

.av-grid{display:flex;gap:8px;justify-content:center;margin:10px 0 14px;flex-wrap:wrap}
.av-btn{font-size:1.6rem;background:var(--panel);border:2px solid var(--line);border-radius:10px;width:44px;height:44px;display:grid;place-items:center;cursor:pointer;transition:all .15s}
.av-btn:hover{border-color:var(--gold);transform:scale(1.08)}

.auth-switch{text-align:center;margin-top:14px;font-size:.85rem;color:var(--gold);cursor:pointer;text-decoration:underline}

        </label>

        ${!isAuthLogin ? `
          <label class="chk" style="margin-top:10px">
            <input type="checkbox" id="dm" checked> Pre-fill beginner observation catalog (demo)
          </label>
        ` : ''}

        <div class="err" id="err"></div>
        <button class="btn big" type="submit">${isAuthLogin ? 'Sign In & Enter Sanctuary' : 'Register Stargazer Crest'}</button>
      </form>

      <div class="auth-switch" id="swAuth">

  document.querySelectorAll('#avGrid .av-btn').forEach(btn => {

  $('#swAuth').onclick = () => {
    isAuthLogin = !isAuthLogin;

  };

  $('#af').onsubmit = async e => {
    e.preventDefault();
    const er = m => $('#err').textContent = m;
    const em = ($('#em').value || '').trim();
    if (!/^\S+@\S+\.\S+$/.test(em)) return er('Enter a valid email address.');

    if (isAuthLogin) {
      const foundUid = localStorage.getItem('tw_user_em_' + em) || UID;
      UID = foundUid;
      localStorage.setItem('tw_uid', UID);
      const ps = await DB.doc('players/' + UID).get();
      if (!ps.exists) {
        const defName = em.split('@')[0];
        me = { id: UID, name: defName, loc: 'Kyoto, JP', av: 'ðŸŒ¸', real: true, me: true, col: {}, given: {}, stamps: [], pts: 0, honor: 0 };

        const x = ps.data();
        me = { id: UID, real: true, me: true, name: x.name, loc: x.loc, av: x.av || 'ðŸŒ¸', pts: x.pts || 0, stamps: x.stamps || [], col: {}, given: {} };
      }
      const [it, rx] = await Promise.all([DB.collection('catalogs/' + UID + '/items').get(), DB.doc('reactions/' + UID).get()]);
      it.docs.forEach(d => me.col[d.id] = d.data());
      if (rx.exists) me.given = rx.data().m || {};
      enter();
      return;
    }

    const nm = clean($('#nm').value);
    if (nm.length < 2) return er('Please enter your Stargazer name (min 2 characters).');
    const loc = clean($('#lc').value) || 'Under the Stars';

    me = {
      id: UID,
      name: nm,
      loc: loc,
      av: selectedAvatar,
      real: true,
      me: true,
      col: {},
      given: {},
      stamps: [],
      pts: 0,
      honor: 0
    };

    if ($('#dm') && $('#dm').checked) seedDemo();

    try {
      localStorage.setItem('tw_user_em_' + em, UID);
      await DB.doc(`data/users/${UID}/account`).set({ email: em, registeredAt: Date.now() });
      await DB.doc('players/' + UID).set(pbody());
      for (const k in me.col) await DB.doc(`catalogs/${UID}/items/${k}`).set(me.col[k]);
    } catch (x) {}
    enter();
  };
}

function enter(){$('#auth').classList.remove('open');calcHonor(me);users.push(me);renderUp();refresh();
DB.collection('players').onSnapshot(s=>{const seen=new Set();s.docs.forEach(d=>{const x=d.data(),u=d.id==me.id?me:(REAL[d.id]=REAL[d.id]||{id:d.id,real:true,col:{},given:{},stamps:[]});Object.assign(u,{name:x.name,loc:x.loc,av:x.av,pts:x.pts,n:x.n,nc:x.nc,stamps:x.stamps||[]});calcHonor(u);seen.add(d.id)});users.length=0;users.push(...SEED,me,...Object.keys(REAL).filter(k=>k!=me.id&&seen.has(k)).map(k=>REAL[k]));refresh()},e=>toast('Live sync stopped ('+e.code+')'));
DB.collection('reactions').onSnapshot(s=>{for(const k in RX)delete RX[k];for(const k in recv)delete recv[k];s.docs.forEach(d=>{const m=(d.data()||{}).m||{};for(const key in m){const q=key.split(':');if(q.length!=4)continue;const a=q[0]+':'+q[1]+':'+q[2];(RX[a]=RX[a]||{lan:0,bow:0})[q[3]]++;recv[q[1]]=(recv[q[1]]||0)+1}});users.forEach(calcHonor);refresh()},e=>{});

/* Standalone fallback: same interface as the claude.ai db (doc().get/set, collection().get/onSnapshot) but stored in this browser's localStorage. Swap localDB() for a Firebase/Supabase/REST adapter to share data between users. */
function localDB(){const L=()=>JSON.parse(localStorage.getItem('tw_db')||'{}'),W=o=>localStorage.setItem('tw_db',JSON.stringify(o)),subs=[];const snapOf=(o,p)=>{const pre=p+'/',docs=Object.keys(o).filter(k=>k.startsWith(pre)&&!k.slice(pre.length).includes('/')).map(k=>({id:k.slice(pre.length),exists:true,data:()=>o[k]}));return{docs,size:docs.length,empty:!docs.length}};const notify=()=>subs.forEach(s=>s.f(snapOf(L(),s.p)));return{doc:p=>({get:async()=>{const v=L()[p];return{id:p.split('/').pop(),exists:v!==undefined,data:()=>v}},set:async d=>{const o=L();o[p]=JSON.parse(JSON.stringify(d));W(o);notify()}}),collection:p=>({get:async()=>snapOf(L(),p),onSnapshot:f=>{const s={p,f};subs.push(s);setTimeout(()=>f(snapOf(L(),p)),0);return()=>subs.splice(subs.indexOf(s),1)}})}}
async function boot(){
  try{
    DB=localDB();
    UID=localStorage.getItem('tw_uid')||('stargazer_'+Math.random().toString(36).slice(2,9));
    localStorage.setItem('tw_uid',UID);
    const ps=await DB.doc('players/'+UID).get();
    if(!ps.exists)return drawAuth();
    const x=ps.data();
    me={id:UID,real:true,me:true,name:x.name,loc:x.loc,av:x.av||'ðŸŒ¸',pts:x.pts||0,stamps:x.stamps||[],col:{},given:{}};
    const[it,rx]=await Promise.all([DB.collection('catalogs/'+UID+'/items').get(),DB.doc('reactions/'+UID).get()]);
    it.docs.forEach(d=>me.col[d.id]=d.data());
    if(rx.exists)me.given=rx.data().m||{};
    enter();
  }catch(e){
    drawAuth();
  }
}
